services:
  postgres:
    image: postgres:17-alpine
    container_name: medsync
    environment:
      POSTGRES_DB: medsync
      POSTGRES_USER: med
      POSTGRES_PASSWORD: sync
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U url -d url" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
